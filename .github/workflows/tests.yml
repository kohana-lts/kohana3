name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: kohana_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      KOHANA_TEST_MYSQL_HOST: 127.0.0.1
      KOHANA_TEST_MYSQL_PORT: 3306
      KOHANA_TEST_MYSQL_USER: root
      KOHANA_TEST_MYSQL_PASSWORD: test
      KOHANA_TEST_MYSQL_DATABASE: kohana_test

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, openssl, mysqli, pdo_mysql, pdo_sqlite, gd, intl, curl
          coverage: none

      - run: composer install --no-interaction --no-progress

      - run: vendor/bin/phpunit
